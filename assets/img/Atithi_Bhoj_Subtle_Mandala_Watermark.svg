<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <g id="petal">
      <path d="M256 256 C228 222 232 184 256 158 C280 184 284 222 256 256Z"
            stroke="#B68A3A" stroke-width="2.5" opacity=".42"/>
      <path d="M256 256 C244 220 249 191 256 172"
            stroke="#B68A3A" stroke-width="1.5" opacity=".28"/>
    </g>
    <g id="leaf">
      <path d="M256 256 C230 246 216 226 220 204 C244 207 260 226 256 256Z"
            stroke="#174A36" stroke-width="2" opacity=".30"/>
      <path d="M256 256 C238 241 228 225 224 210"
            stroke="#174A36" stroke-width="1.4" opacity=".22"/>
    </g>
  </defs>

  <!-- Subtle Indian mandala / jaali-inspired watermark -->
  <g transform="translate(256 256)">
    <circle r="218" stroke="#B68A3A" stroke-width="2" opacity=".16"/>
    <circle r="188" stroke="#B68A3A" stroke-width="1.5" opacity=".12"/>
    <circle r="126" stroke="#174A36" stroke-width="1.5" opacity=".10"/>
    <circle r="72" stroke="#B68A3A" stroke-width="2" opacity=".16"/>

    <g>
      <use href="#petal"/>
      <use href="#petal" transform="rotate(30)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(150)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(210)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(300)"/>
      <use href="#petal" transform="rotate(330)"/>
    </g>

    <g>
      <use href="#leaf" transform="rotate(15)"/>
      <use href="#leaf" transform="rotate(75)"/>
      <use href="#leaf" transform="rotate(135)"/>
      <use href="#leaf" transform="rotate(195)"/>
      <use href="#leaf" transform="rotate(255)"/>
      <use href="#leaf" transform="rotate(315)"/>
    </g>

    <g stroke="#B68A3A" stroke-width="2" opacity=".25">
      <path d="M0-42 L12-12 L42 0 L12 12 L0 42 L-12 12 L-42 0 L-12-12 Z"/>
      <circle r="18"/>
    </g>

    <!-- Fine jaali-style diamond lattice -->
    <g stroke="#B68A3A" stroke-width="1" opacity=".10">
      <path d="M-170 0 L0-170 L170 0 L0 170 Z"/>
      <path d="M-120 0 L0-120 L120 0 L0 120 Z"/>
      <path d="M-170 0 L0 170 M0-170 L170 0 M-120 0 L0 120 M0-120 L120 0"/>
    </g>
  </g>
</svg>